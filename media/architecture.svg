<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" width="900" height="420" role="img" aria-label="Approach A uses two separate models; Approach B uses one shared encoder with two heads">
<style>text{font:13px sans-serif;fill:#24292F}.t{font-weight:bold;font-size:15px}.s{font-size:11px;fill:#57606A}</style>
<rect width="900" height="420" rx="10" fill="#F6F8FA"/>
<defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8z" fill="#57606A"/></marker></defs>
<text class="t" x="20" y="28">Approach A: two separate models</text>
<rect x="20" y="140" width="90" height="40" rx="6" fill="#FFFFFF" stroke="#57606A"/>
<text x="65.0" y="165.0" text-anchor="middle">Tweet</text>
<rect x="170" y="70" width="170" height="50" rx="6" fill="#CCE4F4" stroke="#57606A"/>
<text x="255.0" y="95.0" text-anchor="middle">FinBERT</text>
<text class="s" x="255.0" y="111.0" text-anchor="middle">fine-tuned, 3 classes</text>
<rect x="170" y="200" width="170" height="50" rx="6" fill="#FBE7B5" stroke="#57606A"/>
<text x="255.0" y="225.0" text-anchor="middle">BERTweet</text>
<text class="s" x="255.0" y="241.0" text-anchor="middle">fine-tuned, 21 classes</text>
<rect x="400" y="70" width="120" height="50" rx="6" fill="#FFFFFF" stroke="#57606A"/>
<text x="460.0" y="100.0" text-anchor="middle">Sentiment</text>
<rect x="400" y="200" width="120" height="50" rx="6" fill="#FFFFFF" stroke="#57606A"/>
<text x="460.0" y="230.0" text-anchor="middle">Company</text>
<line x1="110" y1="160" x2="170" y2="95" stroke="#57606A" stroke-width="1.5" marker-end="url(#a)"/>
<line x1="110" y1="160" x2="170" y2="225" stroke="#57606A" stroke-width="1.5" marker-end="url(#a)"/>
<line x1="340" y1="95" x2="400" y2="95" stroke="#57606A" stroke-width="1.5" marker-end="url(#a)"/>
<line x1="340" y1="225" x2="400" y2="225" stroke="#57606A" stroke-width="1.5" marker-end="url(#a)"/>
<text class="s" x="170" y="275">a helper function returns both outputs for one tweet</text>
<text class="t" x="560" y="28">Approach B: shared encoder, two heads</text>
<rect x="560" y="140" width="80" height="40" rx="6" fill="#FFFFFF" stroke="#57606A"/>
<text x="600.0" y="165.0" text-anchor="middle">Tweet</text>
<rect x="690" y="120" width="190" height="80" rx="6" fill="#CCE4F4" stroke="#57606A"/>
<text x="785.0" y="160.0" text-anchor="middle">FinTwitBERT encoder</text>
<text class="s" x="785.0" y="176.0" text-anchor="middle">shared, fine-tuned</text>
<rect x="690" y="40" width="190" height="45" rx="6" fill="#D4EFE5" stroke="#57606A"/>
<text x="785.0" y="62.5" text-anchor="middle">Sentiment head</text>
<text class="s" x="785.0" y="78.5" text-anchor="middle">pretrained, fine-tuned</text>
<rect x="690" y="235" width="190" height="45" rx="6" fill="#FBE7B5" stroke="#57606A"/>
<text x="785.0" y="257.5" text-anchor="middle">Company head</text>
<text class="s" x="785.0" y="273.5" text-anchor="middle">new, trained from scratch</text>
<line x1="640" y1="160" x2="690" y2="160" stroke="#57606A" stroke-width="1.5" marker-end="url(#a)"/>
<line x1="785" y1="120" x2="785" y2="85" stroke="#57606A" stroke-width="1.5" marker-end="url(#a)"/>
<line x1="785" y1="200" x2="785" y2="235" stroke="#57606A" stroke-width="1.5" marker-end="url(#a)"/>
<text class="s" x="560" y="320">Two copies (L, R) are trained; a consistency loss ties their</text>
<text class="s" x="560" y="336">predictions on tweets that lack the label for a task.</text>
<text class="s" x="20" y="400">Diagram drawn from analysis/fig_architecture.py.</text>
</svg>